  - generic [ref=e3]:
    - region "Informasi LihatLangit" [ref=e4]:
      - heading "LihatLangit — Cek Cuaca Indonesia Real-Time dari BMKG" [level=1] [ref=e5]
      - paragraph [ref=e6]: LihatLangit adalah aplikasi web gratis untuk cek cuaca Indonesia secara real-time. Semua data prakiraan cuaca bersumber langsung dari BMKG (Badan Meteorologi, Klimatologi, dan Geofisika) — sumber resmi cuaca Indonesia. Cari cuaca hingga level desa/kelurahan di seluruh Indonesia dari Sabang sampai Merauke.
      - heading "Fitur Cek Cuaca Indonesia" [level=2] [ref=e7]
      - list [ref=e8]:
        - listitem [ref=e9]: Prakiraan cuaca 3 hari ke depan dengan interval 3 jam
        - listitem [ref=e10]: Pencarian cuaca per kota, kecamatan, dan desa/kelurahan
        - listitem [ref=e11]: Peta cuaca interaktif untuk 40+ kota besar Indonesia
        - listitem [ref=e12]: Peringatan dini cuaca ekstrem dan nowcast BMKG real-time
        - listitem [ref=e13]: Indeks UV, kelembapan udara, kecepatan angin, tekanan udara
        - listitem [ref=e14]: "Kondisi laut: tinggi gelombang dan arah angin laut"
        - listitem [ref=e15]: Informasi waktu terbit dan terbenam matahari serta fase bulan
        - listitem [ref=e16]: Berita dan siaran pers terkini dari BMKG
      - heading "Cuaca Kota Besar Indonesia" [level=2] [ref=e17]
      - paragraph [ref=e18]: "Cek prakiraan cuaca untuk kota-kota besar Indonesia: cuaca Jakarta, cuaca Bandung, cuaca Surabaya, cuaca Yogyakarta, cuaca Medan, cuaca Makassar, cuaca Denpasar (Bali), cuaca Semarang, cuaca Palembang, dan cuaca Balikpapan — semua tersedia dengan data akurat dari BMKG."
      - heading "Pertanyaan Umum tentang Cuaca Indonesia" [level=2] [ref=e19]
      - heading "Bagaimana cara cek cuaca hari ini di Indonesia?" [level=3] [ref=e20]
      - paragraph [ref=e21]: Buka LihatLangit dan ketik nama kota atau desa di kolom pencarian. Aplikasi akan menampilkan cuaca hari ini beserta prakiraan 3 hari ke depan dengan data langsung dari BMKG, termasuk suhu udara, kondisi langit, kelembapan, dan kecepatan angin.
      - heading "Apakah prakiraan cuaca BMKG akurat?" [level=3] [ref=e22]
      - paragraph [ref=e23]: BMKG menggunakan sistem pemodelan cuaca numerik dan jaringan stasiun pengamatan di seluruh Indonesia. Prakiraan BMKG adalah sumber data cuaca resmi dan paling akurat untuk kondisi iklim tropis Indonesia, diperbarui secara berkala setiap hari.
      - heading "Apa itu nowcast BMKG?" [level=3] [ref=e24]
      - paragraph [ref=e25]: Nowcast BMKG adalah peringatan dini cuaca ekstrem jangka pendek (0–2 jam ke depan) yang dikeluarkan oleh BMKG. LihatLangit menampilkan nowcast BMKG secara real-time agar pengguna dapat mengantisipasi hujan lebat, angin kencang, atau cuaca berbahaya di wilayah mereka.
      - heading "Cuaca besok di kota saya bagaimana?" [level=3] [ref=e26]
      - paragraph [ref=e27]: LihatLangit menampilkan prakiraan cuaca besok dan lusa dengan data per 3 jam dari BMKG. Cari nama kota atau wilayah kamu untuk melihat prediksi cuaca lengkap termasuk suhu, kemungkinan hujan, kecepatan angin, dan kondisi langit.
      - heading "Tentang Sumber Data BMKG" [level=2] [ref=e28]
      - paragraph [ref=e29]: BMKG (Badan Meteorologi, Klimatologi, dan Geofisika) adalah lembaga pemerintah Indonesia yang bertugas mengamati dan mendistribusikan informasi cuaca resmi. LihatLangit mengakses data BMKG secara langsung melalui API publik BMKG di data.bmkg.go.id, memastikan informasi cuaca yang ditampilkan selalu akurat dan terkini.
