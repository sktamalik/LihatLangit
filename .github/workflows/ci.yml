name: CI

# Trigger: setiap push ke branch mana pun + PR
on:
  push:
  pull_request:

jobs:
  ci:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
