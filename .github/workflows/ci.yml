name: CI

# Trigger: setiap push ke branch mana pun + PR
on:
  push:
  pull_request:

jobs:
  ci:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>&1 | tee lint-output.txt
      - name: Upload lint output on failure
        if: failure()
        run: cat lint-output.txt

      - name: Build (Next.js)
        run: npm run build
